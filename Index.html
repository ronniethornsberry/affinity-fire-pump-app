<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Affinity - NFPA Fire Pump Testing Suite</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM CDNs -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for in-browser JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-black text-white font-sans antialiased selection:bg-red-600 selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useCallback } = React;

        const NOZZLE_SIZES = [
          { label: '3/8"', value: 0.375 },
          { label: '7/16"', value: 0.4375 },
          { label: '1/2"', value: 0.5 },
          { label: '9/16"', value: 0.5625 },
          { label: '5/8"', value: 0.625 },
          { label: '3/4"', value: 0.75 },
          { label: '1"', value: 1.0 },
          { label: '1-1/8"', value: 1.125 },
          { label: '1-1/4"', value: 1.25 },
          { label: '1-3/8"', value: 1.375 },
          { label: '1-1/2"', value: 1.5 },
          { label: '1-3/4"', value: 1.75 },
          { label: '2"', value: 2.0 },
          { label: '2-1/4"', value: 2.25 },
          { label: '2-1/2"', value: 2.5 }
        ];

        const COEFFICIENTS = [
          { label: 'Smooth Cone / Playpipe (0.99)', value: 0.99 },
          { label: 'Standard Fire Hose Nozzle (0.97)', value: 0.97 },
          { label: 'Short Barrel / Smooth Tip (0.95)', value: 0.95 },
          { label: 'Open Butt / Smooth Hose End (0.90)', value: 0.90 }
        ];

        const DEFINITIONS_LIST = [
          { term: 'BHP', desc: 'Brake Horsepower: The actual mechanical horsepower delivered by the driver to the pump shaft.' },
          { term: 'GPM', desc: 'Gallons Per Minute: The volumetric flow rate of water delivered by the fire pump.' },
          { term: 'PSI', desc: 'Pounds per Square Inch: Unit of pressure measurement used for discharge and suction pressures.' },
          { term: 'RPM', desc: 'Revolutions Per Minute: Rotational speed of the pump impeller and driver.' },
          { term: 'FLA', desc: 'Full Load Amps: The maximum current a motor is designed to draw at rated voltage.' },
          { term: 'NFPA', desc: 'National Fire Protection Association: Publishes NFPA 20 (Installation) and NFPA 25 (ITM).' },
          { term: 'Churn (0% Flow)', desc: 'The condition where the pump is running against a closed discharge valve.' },
          { term: 'Rated Flow (100%)', desc: 'The design capacity of the fire pump specified by manufacturer engineering plans.' },
          { term: 'Peak Load (150%)', desc: 'The maximum expected demand condition tested to verify pump overload performance.' },
          { term: 'Net Pressure', desc: 'Total head pressure generated, calculated as Discharge Pressure minus Suction Pressure.' }
        ];

        const AFFINITY_LAWS_LIST = [
          { law: '1. Flow Rate (Q)', formula: 'Q₂ = Q₁ × (N₂ / N₁)', desc: 'Flow rate varies directly with shaft speed (RPM).' },
          { law: '2. Pressure / Head (H)', formula: 'H₂ = H₁ × (N₂ / N₁)²', desc: 'Pressure and head vary with the square of the speed ratio.' },
          { law: '3. Power / BHP (P)', formula: 'P₂ = P₁ × (N₂ / N₁)³', desc: 'Brake horsepower varies with the cube of the speed ratio.' }
        ];

        const FIELD_FORMULAS_LIST = [
          { title: 'Flow Calculation (Pitot)', formula: 'Q = 29.83 × c × d² × √P', desc: 'c = coefficient, d = nozzle diameter in inches, P = pitot pressure in PSI.' },
          { title: 'Net Pump Pressure', formula: 'PNP = Discharge PSI - Suction PSI', desc: 'Applies to positive suction supplies.' },
          { title: 'Speed Adjustment', formula: 'Adjusted PSI = Measured PSI × (Rated RPM / Actual RPM)²', desc: 'Used when engine/motor speed fluctuates during test.' }
        ];

        const VERTICAL_TURBINE_STEPS = [
          { step: '1. Measure Static Water Level', desc: 'Measure distance from datum to water surface before starting pump.' },
          { step: '2. Monitor Pumping Water Level', desc: 'Record drawdown water level in well or underground tank at each test point.' },
          { step: '3. Calculate Static Lift / Suction Head', desc: 'Convert feet of lift to negative suction pressure (PSI) by dividing total pumping water level height by 2.31.' },
          { step: '4. Adjust Net Pressure', desc: 'Incorporate negative suction head: PNP = Discharge PSI - (-Suction Lift PSI).' }
        ];

        const STAGE_METADATA = [
          { key: 'churn', title: '0% Churn (Closed Valve)' },
          { key: 'rated', title: '100% Rated Flow' },
          { key: 'peak', title: '150% Peak Flow' }
        ];

        function ModalShell({ title, onClose, children }) {
          return (
            <div className="fixed inset-0 z-50 bg-black/90 flex items-center justify-center p-4 overflow-y-auto">
              <div className="bg-black border-2 border-red-600 w-full max-w-2xl rounded-lg p-6 text-white shadow-2xl relative my-8">
                <div className="flex justify-between items-center border-b border-red-600 pb-3 mb-4">
                  <h3 className="text-xl font-black uppercase tracking-wider text-red-500">{title}</h3>
                  <button onClick={onClose} className="bg-red-600 text-white font-black px-4 py-1 rounded hover:bg-red-700">X</button>
                </div>
                <div className="max-h-[70vh] overflow-y-auto pr-2 space-y-4">{children}</div>
              </div>
            </div>
          );
        }

        function FlowStageCard({ meta, data, onUpdate }) {
          const handleInputChange = (field, val) => onUpdate(meta.key, { ...data, [field]: val });
          
          const handleHoseChange = (index, field, val) => {
            const newHoses = [...data.hoses];
            newHoses[index] = { ...newHoses[index], [field]: val };
            onUpdate(meta.key, { ...data, hoses: newHoses });
          };

          const addHose = () => onUpdate(meta.key, { ...data, hoses: [...data.hoses, { pitot: '', nozzle: '1.0', coeff: '0.97' }] });
          const removeHose = (index) => onUpdate(meta.key, { ...data, hoses: data.hoses.filter((_, i) => i !== index) });

          const totalGpm = data.hoses.reduce((sum, h) => {
            const p = parseFloat(h.pitot) || 0;
            const d = parseFloat(h.nozzle) || 1.0;
            const c = parseFloat(h.coeff) || 0.97;
            if (p <= 0) return sum;
            return sum + Math.round(29.83 * c * Math.pow(d, 2) * Math.sqrt(p));
          }, 0);

          const discPsi = parseFloat(data.dischargePsi) || 0;
          const sucPsi = parseFloat(data.suctionPsi) || 0;
          const netPsi = discPsi - sucPsi;

          return (
            <div className="bg-black border-2 border-red-600 rounded-lg p-4 space-y-4 shadow-md">
              <div className="border-b border-red-600 pb-2 flex justify-between items-center">
                <h3 className="font-black text-red-500 uppercase tracking-wide">{meta.title}</h3>
                <span className="text-xs bg-red-600 text-white px-2 py-1 rounded font-bold">Total GPM: {totalGpm}</span>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                  <label className="block text-xs font-bold uppercase text-red-400 mb-1">Discharge Pressure (PSI)</label>
                  <input 
                    type="number" 
                    value={data.dischargePsi} 
                    onChange={(e) => handleInputChange('dischargePsi', e.target.value)}
                    className="w-full bg-black border border-red-600 rounded p-2 text-white font-mono focus:outline-none focus:border-white"
                  />
                </div>
                <div>
                  <label className="block text-xs font-bold uppercase text-red-400 mb-1">Suction Pressure (PSI)</label>
                  <input 
                    type="number" 
                    value={data.suctionPsi} 
                    onChange={(e) => handleInputChange('suctionPsi', e.target.value)}
                    className="w-full bg-black border border-red-600 rounded p-2 text-white font-mono focus:outline-none focus:border-white"
                  />
                </div>
              </div>

              <div className="bg-zinc-900 p-3 rounded border border-zinc-800 space-y-3">
                <div className="flex justify-between items-center">
                  <span className="text-xs font-bold text-red-400 uppercase">Discharge Hoses / Nozzles</span>
                  <button onClick={addHose} className="bg-red-600 text-white text-xs font-bold px-2 py-1 rounded hover:bg-red-700">+ Add Hose</button>
                </div>

                {data.hoses.map((hose, idx) => {
                  const p = parseFloat(hose.pitot) || 0;
                  const d = parseFloat(hose.nozzle) || 1.0;
                  const c = parseFloat(hose.coeff) || 0.97;
                  const hoseGpm = p > 0 ? Math.round(29.83 * c * Math.pow(d, 2) * Math.sqrt(p)) : 0;

                  return (
                    <div key={idx} className="grid grid-cols-1 sm:grid-cols-4 gap-2 items-center bg-black p-2 rounded border border-red-900">
                      <div>
                        <label className="block text-[10px] text-zinc-400 uppercase">Pitot (PSI)</label>
                        <input 
                          type="number" 
                          value={hose.pitot} 
                          onChange={(e) => handleHoseChange(idx, 'pitot', e.target.value)}
                          placeholder="0" 
                          className="w-full bg-black border border-red-600 rounded p-1 text-white text-sm font-mono"
                        />
                      </div>
                      <div>
                        <label className="block text-[10px] text-zinc-400 uppercase">Nozzle Size</label>
                        <select 
                          value={hose.nozzle} 
                          onChange={(e) => handleHoseChange(idx, 'nozzle', e.target.value)}
                          className="w-full bg-black border border-red-600 rounded p-1 text-white text-sm"
                        >
                          {NOZZLE_SIZES.map(n => <option key={n.value} value={n.value}>{n.label}</option>)}
                        </select>
                      </div>
                      <div>
                        <label className="block text-[10px] text-zinc-400 uppercase">Coefficient</label>
                        <select 
                          value={hose.coeff} 
                          onChange={(e) => handleHoseChange(idx, 'coeff', e.target.value)}
                          className="w-full bg-black border border-red-600 rounded p-1 text-white text-sm"
                        >
                          {COEFFICIENTS.map(co => <option key={co.value} value={co.value}>{co.label}</option>)}
                        </select>
                      </div>
                      <div className="flex justify-between items-center sm:justify-end space-x-2">
                        <span className="text-xs font-mono text-red-500 font-bold">{hoseGpm} GPM</span>
                        {data.hoses.length > 1 && (
                          <button onClick={() => removeHose(idx)} className="bg-red-900 text-white text-xs px-2 py-1 rounded">X</button>
                        )}
                      </div>
                    </div>
                  );
                })}
              </div>

              <div className="flex justify-between items-center pt-2 border-t border-zinc-800 text-sm font-mono">
                <span className="text-zinc-400">Calculated Net Pressure:</span>
                <span className="text-red-500 font-bold">{netPsi} PSI</span>
              </div>
            </div>
          );
        }

        function App() {
          const [activeModal, setActiveModal] = useState(null);

          const [sysInfo, setSysInfo] = useState({
            ratedGpm: '',
            ratedPsi: '',
            ratedHead: '',
            ratedRpm: '',
            ratedBhp: '',
            ratedFla: '',
            voltage: '',
            testLocation: ''
          });

          const [stages, setStages] = useState({
            churn: { dischargePsi: '', suctionPsi: '', hoses: [{ pitot: '', nozzle: '1.0', coeff: '0.97' }] },
            rated: { dischargePsi: '', suctionPsi: '', hoses: [{ pitot: '', nozzle: '1.0', coeff: '0.97' }] },
            peak: { dischargePsi: '', suctionPsi: '', hoses: [{ pitot: '', nozzle: '1.0', coeff: '0.97' }] }
          });

          const [recommendError, setRecommendError] = useState('');
          const [recommendedSetup, setRecommendedSetup] = useState(null);

          const handleSysInfoChange = useCallback((field, val) => {
            setSysInfo(prev => {
              const updated = { ...prev, [field]: val };
              if (field === 'ratedPsi') {
                updated.ratedHead = val === '' ? '' : (parseFloat(val) * 2.31).toFixed(1);
              } else if (field === 'ratedHead') {
                updated.ratedPsi = val === '' ? '' : (parseFloat(val) / 2.31).toFixed(1);
              }
              return updated;
            });
          }, []);

          const handleStageUpdate = useCallback((stageKey, newData) => {
            setStages(prev => ({ ...prev, [stageKey]: newData }));
          }, []);

          const handleOpenRecommend = () => {
            if (!sysInfo.ratedGpm || sysInfo.ratedGpm.trim() === '') {
              setRecommendError('ERROR: Please input Rated GPM in Pump & System Info first.');
              return;
            }
            setRecommendError('');
            const gpm = parseFloat(sysInfo.ratedGpm);
            setRecommendedSetup({
              churnGpm: 0,
              ratedGpm: gpm,
              peakGpm: Math.round(gpm * 1.5),
              ratedPitot: '50',
              peakPitot: '45',
              note: `Based on your Rated GPM of ${gpm} GPM, configure test header with recommended nozzles.`
            });
            setActiveModal('recommend');
          };

          const getStageTotalGpm = (stageKey) => {
            return stages[stageKey].hoses.reduce((sum, h) => {
              const p = parseFloat(h.pitot) || 0;
              const d = parseFloat(h.nozzle) || 1.0;
              const c = parseFloat(h.coeff) || 0.97;
              if (p <= 0) return sum;
              return sum + Math.round(29.83 * c * Math.pow(d, 2) * Math.sqrt(p));
            }, 0);
          };

          const churnNet = (parseFloat(stages.churn.dischargePsi) || 0) - (parseFloat(stages.churn.suctionPsi) || 0);
          const ratedNet = (parseFloat(stages.rated.dischargePsi) || 0) - (parseFloat(stages.rated.suctionPsi) || 0);
          const peakNet = (parseFloat(stages.peak.dischargePsi) || 0) - (parseFloat(stages.peak.suctionPsi) || 0);

          const ratedPsiVal = parseFloat(sysInfo.ratedPsi) || 1;
          const churnPass = churnNet >= (ratedPsiVal * 1.0) && churnNet <= (ratedPsiVal * 1.4);
          const ratedPass = ratedNet >= ratedPsiVal;
          const peakPass = peakNet >= (ratedPsiVal * 0.65);
          const overallPass = churnPass && ratedPass && peakPass;

          return (
            <div className="min-h-screen bg-black text-white font-sans pb-16">
              <header className="border-b-2 border-red-600 bg-black sticky top-0 z-40 p-4 shadow-lg">
                <div className="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
                  <div>
                    <h1 className="text-2xl font-black uppercase tracking-widest text-red-600">AFFINITY</h1>
                    <p className="text-xs text-zinc-400 font-mono">NFPA 20/25 Fire Pump Field-Testing Suite</p>
                  </div>
                  <div className="flex flex-wrap gap-2">
                    <button onClick={() => setActiveModal('definitions')} className="bg-zinc-900 border border-red-600 hover:bg-red-600 text-xs font-bold uppercase px-3 py-1.5 rounded transition">Definitions</button>
                    <button onClick={() => setActiveModal('formulas')} className="bg-zinc-900 border border-red-600 hover:bg-red-600 text-xs font-bold uppercase px-3 py-1.5 rounded transition">Formulas</button>
                    <button onClick={() => setActiveModal('vertical')} className="bg-zinc-900 border border-red-600 hover:bg-red-600 text-xs font-bold uppercase px-3 py-1.5 rounded transition">Vertical Turbine Guide</button>
                  </div>
                </div>
              </header>

              <main className="max-w-7xl mx-auto p-4 space-y-6">
                <section className="bg-black border-2 border-red-600 rounded-lg p-4 shadow-xl space-y-4">
                  <div className="border-b border-red-600 pb-2 flex justify-between items-center">
                    <h2 className="font-black text-red-500 uppercase tracking-wide">Pump & System Info</h2>
                    <span className="text-xs bg-red-600 text-white px-2 py-1 rounded font-bold">NFPA 20 / 25 Compliant</span>
                  </div>

                  <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4">
                    <div>
                      <label className="block text-xs font-bold uppercase text-red-400 mb-1">Rated GPM</label>
                      <input type="number" value={sysInfo.ratedGpm} onChange={(e) => { handleSysInfoChange('ratedGpm', e.target.value); if(recommendError) setRecommendError(''); }} placeholder="e.g. 1000" className="w-full bg-black border border-red-600 rounded p-2 text-white font-mono" />
                    </div>
                    <div>
                      <label className="block text-xs font-bold uppercase text-red-400 mb-1">Rated PSI</label>
                      <input type="number" value={sysInfo.ratedPsi} onChange={(e) => handleSysInfoChange('ratedPsi', e.target.value)} placeholder="e.g. 100" className="w-full bg-black border border-red-600 rounded p-2 text-white font-mono" />
                    </div>
                    <div>
                      <label className="block text-xs font-bold uppercase text-red-400 mb-1">Rated Head (ft)</label>
                      <input type="number" value={sysInfo.ratedHead} onChange={(e) => handleSysInfoChange('ratedHead', e.target.value)} placeholder="e.g. 231" className="w-full bg-black border border-red-600 rounded p-2 text-white font-mono" />
                    </div>
                    <div>
                      <label className="block text-xs font-bold uppercase text-red-400 mb-1">Rated RPM</label>
                      <input type="number" value={sysInfo.ratedRpm} onChange={(e) => handleSysInfoChange('ratedRpm', e.target.value)} placeholder="e.g. 1760" className="w-full bg-black border border-red-600 rounded p-2 text-white font-mono" />
                    </div>
                    <div>
                      <label className="block text-xs font-bold uppercase text-red-400 mb-1">Brake HP (BHP)</label>
                      <input type="number" value={sysInfo.ratedBhp} onChange={(e) => handleSysInfoChange('ratedBhp', e.target.value)} placeholder="e.g. 75" className="w-full bg-black border border-red-600 rounded p-2 text-white font-mono" />
                    </div>
                    <div>
                      <label className="block text-xs font-bold uppercase text-red-400 mb-1">Rated FLA</label>
                      <input type="number" value={sysInfo.ratedFla} onChange={(e) => handleSysInfoChange('ratedFla', e.target.value)} placeholder="e.
